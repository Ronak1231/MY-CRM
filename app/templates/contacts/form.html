{% extends "base.html" %}
{% block title %}{{ 'Edit' if contact else 'New' }} Contact{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">{{ 'Edit' if contact else 'New' }} {{ 'Purchase' if kind=='purchase' else 'Sales' }} Contact</h4>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card p-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full Name *</label>
        <input type="text" class="form-control" name="name" value="{{ contact.name if contact else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Designation</label>
        <input type="text" class="form-control" name="designation" value="{{ contact.designation if contact else '' }}">
      </div>
      {% if kind == 'purchase' %}
      <div class="col-md-6">
        <label class="form-label">Vendor</label>
        <select class="form-select" name="vendor_id">
          <option value="">None</option>
          {% for v in vendors %}
          <option value="{{ v.id }}" {% if contact and contact.vendor_id==v.id %}selected{% endif %}>{{ v.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% else %}
      <div class="col-md-6">
        <label class="form-label">Account</label>
        <select class="form-select" name="account_id">
          <option value="">None</option>
          {% for a in accounts %}
          <option value="{{ a.id }}" {% if contact and contact.account_id==a.id %}selected{% endif %}>{{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" value="{{ contact.email if contact else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" name="phone" value="{{ contact.phone if contact else '' }}">
      </div>
      <div class="col-md-6 form-check mt-4">
        <input type="checkbox" class="form-check-input" name="is_primary" id="is_primary" {% if contact and contact.is_primary %}checked{% endif %}>
        <label class="form-check-label" for="is_primary">Primary Contact</label>
      </div>
      <div class="col-md-12">
        <label class="form-label">Notes</label>
        <textarea class="form-control" name="notes" rows="2">{{ contact.notes if contact else '' }}</textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Owner</label>
        <select class="form-select" name="owner_id">
          {% for u in users %}
          <option value="{{ u.id }}" {% if contact and contact.owner_id==u.id %}selected{% elif not contact and u.id==current_user.id %}selected{% endif %}>{{ u.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary">Save Contact</button>
    <a href="{{ url_for('contacts.list_purchase_contacts' if kind=='purchase' else 'contacts.list_sales_contacts') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}

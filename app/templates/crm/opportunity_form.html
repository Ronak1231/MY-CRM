{% extends "base.html" %}
{% block title %}{{ 'Edit' if opportunity else 'New' }} Opportunity{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">{{ 'Edit Opportunity' if opportunity else 'New Opportunity' }}</h4>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card p-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Opportunity Name *</label>
        <input type="text" class="form-control" name="name" value="{{ opportunity.name if opportunity else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Account *</label>
        <select class="form-select" name="account_id" required>
          <option value="">Select account...</option>
          {% for a in accounts %}
          <option value="{{ a.id }}" {% if opportunity and opportunity.account_id==a.id %}selected{% endif %}>{{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Stage</label>
        <select class="form-select" name="stage">
          {% for s in stages %}
          <option value="{{ s }}" {% if opportunity and opportunity.stage==s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Amount</label>
        <input type="number" step="0.01" class="form-control" name="amount" value="{{ opportunity.amount if opportunity else 0 }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Probability (%)</label>
        <input type="number" min="0" max="100" class="form-control" name="probability" value="{{ opportunity.probability if opportunity else 10 }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Expected Close Date</label>
        <input type="date" class="form-control" name="expected_close_date" value="{{ opportunity.expected_close_date if opportunity else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Close Reason (if Won/Lost)</label>
        <input type="text" class="form-control" name="close_reason" value="{{ opportunity.close_reason if opportunity else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Owner</label>
        <select class="form-select" name="owner_id">
          {% for u in users %}
          <option value="{{ u.id }}" {% if opportunity and opportunity.owner_id==u.id %}selected{% elif not opportunity and u.id==current_user.id %}selected{% endif %}>{{ u.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary">Save Opportunity</button>
    <a href="{{ url_for('crm.list_opportunities') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}

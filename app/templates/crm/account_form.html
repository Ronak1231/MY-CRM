{% extends "base.html" %}
{% block title %}{{ 'Edit' if account else 'New' }} Account{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">{{ 'Edit Account' if account else 'New Account' }}</h4>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card p-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Account / Company Name *</label>
        <input type="text" class="form-control" name="name" value="{{ account.name if account else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Industry</label>
        <select class="form-select" name="industry">
          <option value="">-- Select --</option>
          {% for i in industries %}
          <option value="{{ i.value }}" {% if account and account.industry==i.value %}selected{% endif %}>{{ i.display_label }}</option>
          {% endfor %}
          {% if account and account.industry and account.industry not in industries|map(attribute='value')|list %}
          <option value="{{ account.industry }}" selected>{{ account.industry }} (custom)</option>
          {% endif %}
        </select>
        <div class="form-text">Manage this list under Admin &gt; Lookups (category: industry).</div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" value="{{ account.email if account else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" name="phone" value="{{ account.phone if account else '' }}">
      </div>
      <div class="col-md-12">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" name="address" value="{{ account.address if account else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">City</label>
        <input type="text" class="form-control" name="city" value="{{ account.city if account else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Country</label>
        <input type="text" class="form-control" name="country" value="{{ account.country if account else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Website</label>
        <input type="text" class="form-control" name="website" value="{{ account.website if account else '' }}">
      </div>
      <div class="col-md-6 form-check mt-4">
        <input type="checkbox" class="form-check-input" name="is_active" id="is_active" {% if not account or account.is_active %}checked{% endif %}>
        <label class="form-check-label" for="is_active">Active</label>
      </div>
      <div class="col-md-6">
        <label class="form-label">Owner</label>
        <select class="form-select" name="owner_id">
          {% for u in users %}
          <option value="{{ u.id }}" {% if account and account.owner_id==u.id %}selected{% elif not account and u.id==current_user.id %}selected{% endif %}>{{ u.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary">Save Account</button>
    <a href="{{ url_for('crm.list_accounts') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}

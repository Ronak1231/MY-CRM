{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} Product{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">{{ 'Edit Product' if product else 'New Product' }}</h4>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card p-3">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">SKU *</label>
        <input type="text" class="form-control" name="sku" value="{{ product.sku if product else '' }}" required>
      </div>
      <div class="col-md-8">
        <label class="form-label">Product Name *</label>
        <input type="text" class="form-control" name="name" value="{{ product.name if product else '' }}" required>
      </div>
      <div class="col-md-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="2">{{ product.description if product else '' }}</textarea>
      </div>
      <div class="col-md-3">
        <label class="form-label">Category</label>
        <select class="form-select" name="category">
          <option value="">-- Select --</option>
          {% for c in categories %}
          <option value="{{ c.value }}" {% if product and product.category==c.value %}selected{% endif %}>{{ c.display_label }}</option>
          {% endfor %}
          {% if product and product.category and product.category not in categories|map(attribute='value')|list %}
          <option value="{{ product.category }}" selected>{{ product.category }} (custom)</option>
          {% endif %}
        </select>
        <div class="form-text">Manage under Admin &gt; Lookups (product_category).</div>
      </div>
      <div class="col-md-3">
        <label class="form-label">Unit</label>
        <select class="form-select" name="unit">
          {% for u in units %}
          <option value="{{ u.value }}" {% if product and product.unit==u.value %}selected{% elif not product and u.value=='pcs' %}selected{% endif %}>{{ u.display_label }}</option>
          {% endfor %}
          {% if product and product.unit and product.unit not in units|map(attribute='value')|list %}
          <option value="{{ product.unit }}" selected>{{ product.unit }} (custom)</option>
          {% endif %}
        </select>
        <div class="form-text">Manage under Admin &gt; Lookups (unit).</div>
      </div>
      <div class="col-md-3">
        <label class="form-label">Cost Price</label>
        <input type="number" step="0.01" class="form-control" name="cost_price" value="{{ product.cost_price if product else 0 }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Selling Price</label>
        <input type="number" step="0.01" class="form-control" name="selling_price" value="{{ product.selling_price if product else 0 }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Stock Qty</label>
        <input type="number" class="form-control" name="stock_qty" value="{{ product.stock_qty if product else 0 }}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Reorder Level</label>
        <input type="number" class="form-control" name="reorder_level" value="{{ product.reorder_level if product else 0 }}">
      </div>
      <div class="col-md-3 form-check mt-4">
        <input type="checkbox" class="form-check-input" name="is_active" id="is_active" {% if not product or product.is_active %}checked{% endif %}>
        <label class="form-check-label" for="is_active">Active</label>
      </div>
      <div class="col-md-3">
        <label class="form-label">Owner</label>
        <select class="form-select" name="owner_id">
          {% for u in users %}
          <option value="{{ u.id }}" {% if product and product.owner_id==u.id %}selected{% elif not product and u.id==current_user.id %}selected{% endif %}>{{ u.full_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary">Save Product</button>
    <a href="{{ url_for('product.list_products') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}

services:
  - type: web
    name: crm-erp
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.9
